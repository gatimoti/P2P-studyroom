<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P リアルタイム StudyRoom</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 安定版 PeerJS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    body { touch-action: manipulation; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen w-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- 1. タイトル & モーダル画面 -->
  <div id="screen-title" class="fixed inset-0 z-50 bg-gray-950 flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-500 rounded-2xl mb-4 border border-blue-500/30">
        <i class="fa-solid fa-headset text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-wide text-white mb-2">P2P StudyRoom</h1>
      <p class="text-gray-400 text-sm mb-8">一時的な音声通話・チャット・画面共有</p>

      <div class="space-y-4">
        <button onclick="openNameModal('host')" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-3">
          <i class="fa-solid fa-plus-circle text-lg"></i> 部屋を作る
        </button>
        <button onclick="openNameModal('guest')" class="w-full py-4 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-3">
          <i class="fa-solid fa-right-to-bracket text-lg"></i> 部屋に参加
        </button>
      </div>
    </div>
  </div>

  <!-- 名前・コード入力モーダル -->
  <div id="modal-name" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
      <h2 id="modal-title" class="text-xl font-bold text-white mb-4">参加設定</h2>
      
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">表示名（最大10文字）</label>
          <input type="text" id="input-username" maxlength="10" placeholder="名前を入力..." class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
        </div>

        <div id="container-room-code" class="hidden">
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">5桁の部屋コード</label>
          <input type="text" id="input-room-code" maxlength="5" placeholder="例: 7A9K2" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white uppercase tracking-widest font-mono text-center text-lg focus:outline-none focus:border-blue-500 transition">
        </div>

        <div id="error-message" class="hidden text-red-400 text-xs bg-red-950/50 border border-red-900/50 p-3 rounded-lg flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="error-text">エラーが発生しました。</span>
        </div>
      </div>

      <div class="flex gap-3">
        <button onclick="closeModal()" class="w-1/3 py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium rounded-xl transition">キャンセル</button>
        <button onclick="submitNameModal()" class="w-2/3 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition">進む</button>
      </div>
    </div>
  </div>

  <!-- 2. メインアプリ画面 -->
  <div id="screen-app" class="hidden flex-1 flex flex-col h-full w-full overflow-hidden">
    
    <!-- ヘッダーバー -->
    <header class="h-16 bg-gray-900 border-b border-gray-800 px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-gray-950 px-3 py-1.5 rounded-lg border border-gray-800">
          <span class="text-xs text-gray-400 font-medium">ROOM:</span>
          <span id="display-room-code" class="font-mono font-bold text-blue-400 tracking-wider">-----</span>
          <button onclick="copyRoomCode()" class="text-gray-400 hover:text-white ml-1 text-xs">
            <i class="fa-solid fa-copy"></i>
          </button>
        </div>
        <span id="my-name-tag" class="text-xs bg-gray-800 px-2.5 py-1 rounded-md text-gray-300">-----</span>
      </div>

      <button onclick="leaveRoom()" class="px-3 py-1.5 bg-red-900/40 hover:bg-red-800/60 text-red-300 border border-red-800/50 text-xs font-semibold rounded-lg transition flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i> 退出
      </button>
    </header>

    <!-- メインエリア -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
      
      <!-- 画面共有 ＆ 参加者グリッド（スクロール可能） -->
      <div class="flex-1 p-4 bg-gray-950 flex flex-col gap-6 overflow-y-auto">
        
        <!-- 画面共有グリッドエリア（全員の画面共有がここに縦並び/グリッドで追加されます） -->
        <div id="screenshare-grid" class="hidden flex flex-col gap-4">
          <!-- 画面共有コンテナがここに動的に追加されます -->
        </div>

        <!-- 参加者アバター一覧 -->
        <div>
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 flex items-center gap-2">
            <i class="fa-solid fa-users"></i> 参加メンバー
          </h3>
          <div id="user-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
        </div>

      </div>

      <!-- チャットパネル -->
      <div class="w-full md:w-80 lg:w-96 bg-gray-900 border-t md:border-t-0 md:border-l border-gray-800 flex flex-col h-64 md:h-full shrink-0">
        <div class="px-4 py-3 border-b border-gray-800 flex items-center gap-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">
          <i class="fa-solid fa-comments"></i> リアルタイムチャット
        </div>

        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4"></div>

        <div class="p-3 bg-gray-950 border-t border-gray-800 shrink-0">
          <div class="flex items-center gap-2">
            <label class="p-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl cursor-pointer transition flex items-center justify-center">
              <i class="fa-solid fa-paperclip"></i>
              <input type="file" id="file-input" class="hidden" accept="image/*,video/*,audio/*" onchange="handleFileUpload(event)">
            </label>
            <input type="text" id="chat-input" placeholder="メッセージを入力..." class="flex-1 px-3 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 transition" onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition flex items-center justify-center">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- フッター -->
    <footer class="h-16 bg-gray-900 border-t border-gray-800 px-4 flex items-center justify-center gap-4 shrink-0">
      <button id="btn-mic" onclick="toggleMic()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-medium text-sm rounded-xl transition border border-gray-700 flex items-center gap-2">
        <i class="fa-solid fa-microphone"></i>
        <span>マイク OFF</span>
      </button>

      <button id="btn-screen" onclick="toggleScreenShare()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-medium text-sm rounded-xl transition border border-gray-700 flex items-center gap-2">
        <i class="fa-solid fa-desktop"></i>
        <span>画面共有</span>
      </button>
    </footer>

  </div>

  <script>
    const NG_WORDS = ["しね", "バカ", "アホ", "死ね", "殺す", "キモい", "fuck", "shit", "bitch"];
    const PEER_PREFIX = "GATIMOTI-STUDYROOM-";

    let peer = null;
    let roomCode = "";
    let myName = "";
    let isHost = false;
    let isMicOn = false;
    let isScreenSharing = false;
    let localAudioStream = null;
    let screenStream = null;

    const connections = {}; 
    const participants = {}; 
    const mediaCalls = {}; // 画面共有/音声通話用Call管理
    const chatHistory = []; 

    function openNameModal(selectedMode) {
      isHost = (selectedMode === 'host');
      document.getElementById('modal-title').innerText = isHost ? '部屋を作る' : '部屋に参加';
      document.getElementById('container-room-code').style.display = isHost ? 'none' : 'block';
      document.getElementById('modal-name').classList.remove('hidden');
      document.getElementById('error-message').classList.add('hidden');
    }

    function closeModal() {
      document.getElementById('modal-name').classList.add('hidden');
    }

    function containsNGWords(text) {
      if (!text) return false;
      const lower = text.toLowerCase();
      return NG_WORDS.some(ng => lower.includes(ng));
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    async function submitNameModal() {
      const nameInput = document.getElementById('input-username').value.trim();
      const errorDiv = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');

      if (!nameInput) {
        errorText.innerText = "名前を入力してください。";
        errorDiv.classList.remove('hidden');
        return;
      }

      if (containsNGWords(nameInput)) {
        errorText.innerText = "不適切な言葉が含まれています。";
        errorDiv.classList.remove('hidden');
        return;
      }

      myName = nameInput;

      if (isHost) {
        roomCode = generateCode();
        initPeer(PEER_PREFIX + roomCode);
      } else {
        const codeInput = document.getElementById('input-room-code').value.trim().toUpperCase();
        if (codeInput.length !== 5) {
          errorText.innerText = "正しい5桁のコードを入力してください。";
          errorDiv.classList.remove('hidden');
          return;
        }
        roomCode = codeInput;
        initPeer(null);
      }
    }

    function initPeer(customId) {
      closeModal();
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        addParticipant(peer.id, myName, isHost);
        startAppUI();

        if (!isHost) {
          connectToHost(PEER_PREFIX + roomCode);
        }
      });

      peer.on('error', (err) => {
        console.error(err);
        if (err.type === 'unavailable-id') {
          alert("そのコードの部屋は既に存在するか接続できません。");
        } else {
          alert("通信エラーが発生しました: " + err.type);
        }
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      peer.on('call', (call) => {
        call.answer();
        setupIncomingMediaCall(call);
      });
    }

    function startAppUI() {
      document.getElementById('screen-title').classList.add('hidden');
      document.getElementById('screen-app').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = roomCode;
      document.getElementById('my-name-tag').innerText = myName;
    }

    function connectToHost(targetPeerId) {
      const conn = peer.connect(targetPeerId, { metadata: { name: myName } });
      setupDataConnection(conn);
    }

    function setupDataConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;

        conn.send({ type: 'join-info', name: myName, peerId: peer.id, isHost: isHost });

        if (isHost) {
          conn.send({
            type: 'sync-history',
            chatHistory: chatHistory,
            participants: participants
          });
        }
      });

      conn.on('data', (data) => {
        handleIncomingData(conn.peer, data);
      });

      conn.on('close', () => {
        removeParticipant(conn.peer);
      });
    }

    function setupIncomingMediaCall(call) {
      call.on('stream', (remoteStream) => {
        const metadata = call.metadata || {};

        if (metadata.type === 'screen') {
          // 画面共有ストリーム受信
          addScreenShareView(call.peer, metadata.name || '参加者', remoteStream);
        } else {
          // 音声ストリーム受信
          let audioEl = document.getElementById(`audio-${call.peer}`);
          if (!audioEl) {
            audioEl = document.createElement('audio');
            audioEl.id = `audio-${call.peer}`;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);
          }
          audioEl.srcObject = remoteStream;
        }
      });

      call.on('close', () => {
        removeScreenShareView(call.peer);
      });
    }

    function handleIncomingData(fromPeerId, data) {
      if (data.type === 'join-info') {
        addParticipant(fromPeerId, data.name, data.isHost);

        if (isHost) {
          broadcastData({
            type: 'participant-joined',
            peerId: fromPeerId,
            name: data.name,
            isHost: data.isHost
          }, fromPeerId);
        }
      } else if (data.type === 'participant-joined') {
        addParticipant(data.peerId, data.name, data.isHost);
      } else if (data.type === 'sync-history') {
        if (data.participants) {
          Object.assign(participants, data.participants);
          renderUserGrid();
        }
        if (data.chatHistory && data.chatHistory.length > 0) {
          data.chatHistory.forEach(item => {
            const isMe = item.senderId === peer.id;
            renderChatMessage(item.name, item.message, isMe, item.file);
            chatHistory.push(item);
          });
        }
      } else if (data.type === 'chat') {
        const isMe = data.senderId === peer.id;
        renderChatMessage(data.name, data.message, isMe, data.file);
        chatHistory.push(data);

        if (isHost) {
          broadcastData(data, fromPeerId);
        }
      } else if (data.type === 'leave') {
        removeParticipant(fromPeerId);
        if (isHost) {
          broadcastData({ type: 'leave', peerId: fromPeerId }, fromPeerId);
        }
      }
    }

    function addParticipant(peerId, name, hostFlag) {
      participants[peerId] = { name: name, isHost: hostFlag };
      renderUserGrid();
    }

    function removeParticipant(peerId) {
      delete participants[peerId];
      delete connections[peerId];
      const audioEl = document.getElementById(`audio-${peerId}`);
      if (audioEl) audioEl.remove();
      removeScreenShareView(peerId);
      renderUserGrid();
    }

    function renderUserGrid() {
      const grid = document.getElementById('user-grid');
      grid.innerHTML = '';

      Object.keys(participants).forEach(id => {
        const p = participants[id];
        const isMe = id === peer?.id;

        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col items-center justify-center gap-2 relative shadow-lg";
        card.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg">
            ${p.name.charAt(0).toUpperCase()}
          </div>
          <div class="text-xs font-semibold text-gray-200 truncate max-w-[100px]">${p.name} ${isMe ? '(あなた)' : ''}</div>
          ${p.isHost ? '<span class="text-[10px] bg-blue-900/60 text-blue-300 border border-blue-700/50 px-2 py-0.5 rounded-full">HOST</span>' : ''}
        `;
        grid.appendChild(card);
      });
    }

    // 画面共有ビューの追加（複数人同時対応）
    function addScreenShareView(peerId, userName, stream) {
      const grid = document.getElementById('screenshare-grid');
      grid.classList.remove('hidden');

      let container = document.getElementById(`screen-container-${peerId}`);
      if (!container) {
        container = document.createElement('div');
        container.id = `screen-container-${peerId}`;
        container.className = "relative bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl w-full min-h-[300px] max-h-[500px] flex items-center justify-center";

        container.innerHTML = `
          <video id="video-${peerId}" autoplay playsinline class="w-full h-full object-contain"></video>
          <div class="absolute top-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-blue-400 border border-blue-500/30 flex items-center gap-2 shadow-md">
            <i class="fa-solid fa-desktop"></i>
            <span>${userName} の画面</span>
          </div>
        `;
        grid.appendChild(container);
      }

      const video = document.getElementById(`video-${peerId}`);
      video.srcObject = stream;
    }

    function removeScreenShareView(peerId) {
      const container = document.getElementById(`screen-container-${peerId}`);
      if (container) container.remove();

      const grid = document.getElementById('screenshare-grid');
      if (grid.children.length === 0) {
        grid.classList.add('hidden');
      }
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (containsNGWords(text)) {
        alert("不適切な表現が含まれています。");
        return;
      }

      const msgObj = {
        type: 'chat',
        senderId: peer.id,
        name: myName,
        message: text,
        file: null
      };

      chatHistory.push(msgObj);
      renderChatMessage(myName, text, true);
      broadcastData(msgObj);
      input.value = '';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 3 * 1024 * 1024) {
        alert("ファイルサイズは3MB以下にしてください。");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = { name: file.name, type: file.type, data: e.target.result };
        const msgObj = {
          type: 'chat',
          senderId: peer.id,
          name: myName,
          message: '',
          file: fileData
        };

        chatHistory.push(msgObj);
        renderChatMessage(myName, '', true, fileData);
        broadcastData(msgObj);
      };
      reader.readAsDataURL(file);
    }

    function broadcastData(data, excludePeerId = null) {
      Object.keys(connections).forEach(peerId => {
        if (peerId !== excludePeerId && connections[peerId] && connections[peerId].open) {
          connections[peerId].send(data);
        }
      });
    }

    function renderChatMessage(senderName, message, isMe, file = null) {
      const chatContainer = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

      let mediaHtml = '';
      if (file) {
        if (file.type.startsWith('image/')) {
          mediaHtml = `<img src="${file.data}" class="max-w-full rounded-lg mt-1 border border-gray-700 max-h-48 object-cover">`;
        } else if (file.type.startsWith('video/')) {
          mediaHtml = `<video src="${file.data}" controls class="max-w-full rounded-lg mt-1 border border-gray-700 max-h-48"></video>`;
        } else if (file.type.startsWith('audio/')) {
          mediaHtml = `<audio src="${file.data}" controls class="w-full mt-1"></audio>`;
        }
      }

      wrapper.innerHTML = `
        <span class="text-[10px] text-gray-500 mb-1 px-1">${senderName}</span>
        <div class="${isMe ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-200'} px-3 py-2 rounded-2xl max-w-[85%] text-xs shadow-md break-words">
          ${message ? `<div>${escapeHtml(message)}</div>` : ''}
          ${mediaHtml}
        </div>
      `;

      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    async function toggleMic() {
      const btn = document.getElementById('btn-mic');
      if (!isMicOn) {
        try {
          localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true;
          btn.classList.replace('bg-gray-800', 'bg-emerald-600');
          btn.querySelector('span').innerText = "マイク ON";

          Object.keys(connections).forEach(peerId => {
            peer.call(peerId, localAudioStream, { metadata: { type: 'audio', name: myName } });
          });
        } catch (err) {
          alert("マイクの利用許可が得られませんでした。");
        }
      } else {
        if (localAudioStream) {
          localAudioStream.getTracks().forEach(track => track.stop());
        }
        isMicOn = false;
        btn.classList.replace('bg-emerald-600', 'bg-gray-800');
        btn.querySelector('span').innerText = "マイク OFF";
      }
    }

    // 画面共有の切り替え（全員同時画面共有対応）
    async function toggleScreenShare() {
      const btn = document.getElementById('btn-screen');

      if (!isScreenSharing) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          isScreenSharing = true;
          btn.classList.replace('bg-gray-800', 'bg-blue-600');

          // 自分のローカル画面にプレビュー追加
          addScreenShareView(peer.id, myName + " (あなた)", screenStream);

          // 接続中の全員に自分の画面共有ストリームを発信
          Object.keys(connections).forEach(peerId => {
            peer.call(peerId, screenStream, { metadata: { type: 'screen', name: myName } });
          });

          // ブラウザ側の「共有停止」ボタンが押された時の処理
          screenStream.getVideoTracks()[0].onended = () => {
            stopScreenShare();
          };
        } catch (err) {
          console.log("画面共有がキャンセルされました");
        }
      } else {
        stopScreenShare();
      }
    }

    function stopScreenShare() {
      const btn = document.getElementById('btn-screen');
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
      }
      removeScreenShareView(peer.id);
      isScreenSharing = false;
      btn.classList.replace('bg-blue-600', 'bg-gray-800');
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(roomCode);
      alert(`部屋コード "${roomCode}" をコピーしました！`);
    }

    function leaveRoom() {
      broadcastData({ type: 'leave' });
      if (peer) peer.destroy();
      location.reload();
    }

    window.addEventListener('beforeunload', () => {
      broadcastData({ type: 'leave' });
    });
  </script>
</body>
</html>
